# -----------------------------------------------------------------------------
# helmsman default skin
# -----------------------------------------------------------------------------

# Skin...
k9s:
  body:
    fgColor: "#8a9bb8"
    bgColor: black
    logoColor: "#92b3f4"
    logoColorMsg: white
    logoColorInfo: green
    logoColorWarn: mediumvioletred
    logoColorError: red
  prompt:
    fgColor: "#8a9bb8"
    bgColor: black
    suggestColor: "#7c9ee6"
    border:
      command: "#92b3f4"
      default: seagreen
  help:
    fgColor: "#8a9bb8"
    bgColor: black
    sectionColor: green
    keyColor: "#7c9ee6"
    numKeyColor: "#b4cbf8"
  frame:
    title:
      fgColor: "#92b3f4"
      bgColor: black
      highlightColor: "#b4cbf8"
      counterColor: papayawhip
      filterColor: seagreen
    border:
      fgColor: "#7c9ee6"
      focusColor: "#b4cbf8"
    menu:
      fgColor: white
      keyColor: "#7c9ee6"
      numKeyColor: "#b4cbf8"
    crumbs:
      fgColor: black
      bgColor: "#92b3f4"
      activeColor: "#92b3f4"
    status:
      newColor: "#b4cbf8"
      modifyColor: greenyellow
      addColor: "#7c9ee6"
      pendingColor: darkorange
      errorColor: orangered
      highlightColor: "#92b3f4"
      killColor: mediumpurple
      completedColor: lightslategray
      # Per-status pod colours (built-in palette; override any of them here).
      # pods:
      #   CrashLoopBackOff: "#ff5370"
  info:
    sectionColor: white
    fgColor: "#92b3f4"
  views:
    table:
      fgColor: "#92b3f4"
      bgColor: black
      cursorFgColor: black
      cursorBgColor: "#92b3f4"
      markColor: palegreen
      header:
        fgColor: white
        bgColor: black
        sorterColor: "#92b3f4"
        selectedSortColumnColor: "#b4cbf8"
    xray:
      fgColor: "#92b3f4"
      bgColor: black
      cursorColor: "#7c9ee6"
      cursorTextColor: black
      graphicColor: "#8a9bb8"
    charts:
      bgColor: black
      dialBgColor: black
      chartBgColor: black
      focusFgColor: white
      focusBgColor: "#92b3f4"
      defaultDialColors:
      - palegreen
      - orangered
      defaultChartColors:
      - palegreen
      - orangered
      resourceColors:
        cpu:
        - "#7c9ee6"
        - darkslateblue
        mem:
        - yellow
        - goldenrod
    yaml:
      keyColor: "#7c9ee6"
      valueColor: papayawhip
      colonColor: white
    picker:
      mainColor: white
      focusColor: "#92b3f4"
      shortcutColor: "#92b3f4"
    logs:
      fgColor: "#b4cbf8"
      bgColor: black
      indicator:
        fgColor: "#7c9ee6"
        bgColor: black
        toggleOnColor: limegreen
        toggleOffColor: gray
  dialog:
    fgColor: "#8a9bb8"
    bgColor: black
    buttonFgColor: black
    buttonBgColor: darkslateblue
    buttonFocusFgColor: black
    buttonFocusBgColor: "#7c9ee6"
    labelFgColor: white
    fieldFgColor: white