name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write   # keyless signing with cosign (the workflow's own identity, no stored key)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # GoReleaser makes an SBOM per archive (`sboms:` in .goreleaser.yml) and needs syft on PATH; the runner has none.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.20.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
