# Opens an issue when upstream k9s has a release newer than the one recorded in UPSTREAM. Runs monthly; it only reads the
# public release list and creates an issue, so the default token is enough.
name: upstream

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: compare with the latest k9s release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mine=$(tr -d '[:space:]' < UPSTREAM)
          latest=$(gh api repos/derailed/k9s/releases/latest --jq .tag_name)
          echo "recorded $mine, latest $latest"
          if [ "$mine" = "$latest" ]; then exit 0; fi
          title="Upstream k9s ${latest} is out (UPSTREAM is ${mine})"
          # one open issue per new version
          if gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          gh issue create --title "${title}" --body "k9s ${latest} was released; helmsman follows ${mine}.

          Release notes: https://github.com/derailed/k9s/releases/tag/${latest}
          How to bring changes in: docs/upstream.md"
